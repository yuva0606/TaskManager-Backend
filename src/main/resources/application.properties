spring.application.name=TaskManager

spring.datasource.url=jdbc:mysql://localhost:3306/taskmanager
spring.datasource.username=root
spring.datasource.password=${MYSQL_PASSWORD}

spring.jpa.hibernate.ddl-auto=create
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

jwt.secret=18fe50e388700e36624cb8bd986a48ea3b6e050c5d01e2058d6b0e53f66da731

spring.security.user.name=admin
spring.security.user.password=admin

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

app.oauth2.redirect-uri=http://localhost:5173/oauth/callback

# Development only. Set true when using HTTPS in production.
app.cookie.secure=false

# Allow the temporary OAuth session cookie on Google's top-level callback.
server.servlet.session.cookie.same-site=lax